name: Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      snapshot:
        type: boolean
        description: Create a snapshot release
        required: false
        default: true
      version:
        type: string
        description: Stable TypeScript Go version to release (e.g. 7.0.2). Leave empty for a dev build.
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tsgo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update submodules
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            git submodule update --init
            cd tsgo
            git fetch --tags --force origin
            git checkout "v${{ inputs.version }}"
          else
            git submodule update --init --remote
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: tsgo/tsc/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: tsgo/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: tsgo
        run: npm ci

      - name: Build Lib
        working-directory: tsgo
        run: npm exec hereby lib

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get tsgo Latest Commit SHA
        id: tsgo_commit
        working-directory: tsgo
        run: |
          echo "tsgo_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "tsgo_commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: git tag ${{ inputs.version || steps.date.outputs.date }}
        if: ${{ inputs.version || !inputs.snapshot }}

      - name: Install dependencies
        run: pnpm i

      - name: Patch Tsgo version
        run: node scripts/tsgo-version.ts
        if: ${{ !inputs.version }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean --skip=validate ${{ !inputs.version && inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSGO_COMMIT: ${{ steps.tsgo_commit.outputs.tsgo_commit }}
          TSGO_COMMIT_SHORT: ${{ steps.tsgo_commit.outputs.tsgo_commit_short }}

      - name: Release script
        run: node scripts/release.ts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TEST_RELEASE: ${{ inputs.snapshot || github.repository == 'sxzz/tsgo-wasm-dev' }}

      - name: Publish NPM packages
        run: pnpm -r publish --no-git-checks --tag ${{ inputs.version && 'latest' || 'nightly' }}

      - name: Purge WASM cache
        run: node scripts/purge-cache.ts

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.txt
